<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchCutter — Text Match Cut Video Generator</title>
    <meta
      name="description"
      content="Turn a phrase with one highlighted word into a newspaper-clipping match cut video. 100% browser-only, no uploads."
    />
  </head>
  <body>
    <main>
      <h1>MatchCutter</h1>
      <p>Wrap one word with <code>==word==</code>. Max 23 chars focal.</p>
      <label
        >Phrase:
        <input
          id="phraseInput"
          type="text"
          placeholder="Markets jittery. ==TACO again==."
          style="width: 360px"
        />
        <span id="charCounter">0/23</span>
      </label>
      <div id="error" style="color: crimson; min-height: 1.2em"></div>
      <div style="margin: 8px 0">
        <button id="btnGenerate" type="button">Generate</button>
        <button id="btnRegenerate" type="button">Regenerate</button>
        <button id="btnDownload" type="button">Download</button>
        <button id="btnHighlight" type="button">Highlight selection</button>
      </div>
      <div
        id="progressWrap"
        style="width: 100%; height: 6px; background: #eee; max-width: 360px"
      ></div>
      <canvas
        id="preview"
        width="540"
        height="960"
        style="border: 1px solid #ccc; max-width: 360px; width: 100%; background: #fff"
      ></canvas>
      <div id="examples" style="margin: 8px 0"></div>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
