<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchCutter — Text Match Cut Video Generator</title>
    <meta
      name="description"
      content="Turn a phrase with one highlighted word into a newspaper-clipping match cut video. 100% browser-only, no uploads."
    />
  </head>
  <body>
    <main>
      <h1>MatchCutter</h1>
      <p>Wrap one word with <code>==word==</code>. Max 23 chars focal.</p>
      <label
        >Phrase:
        <input
          id="phraseInput"
          type="text"
          placeholder="Markets jittery. ==TACO again==."
          style="width: 360px"
        />
        <span id="charCounter">0/23</span>
      </label>
      <div id="error" style="color: crimson; min-height: 1.2em"></div>
      <div style="margin: 8px 0">
        <button id="btnGenerate" type="button">Generate</button>
        <button id="btnRegenerate" type="button">Regenerate</button>
        <button id="btnDownload" type="button">Download</button>
        <button id="btnHighlight" type="button">Highlight selection</button>
      </div>
      <fieldset style="max-width: 360px">
        <legend>Output</legend>
        <label
          >Aspect:
          <select id="aspectSelect">
            <option value="9:16" selected>9:16 (1080×1920)</option>
            <option value="1:1">1:1 (1080×1080)</option>
            <option value="16:9">16:9 (1920×1080)</option>
          </select>
        </label>
        <label style="margin-left: 12px"
          >Format:
          <select id="formatSelect">
            <option value="mp4" selected>MP4</option>
            <option value="webm">WebM</option>
          </select>
        </label>
      </fieldset>
      <fieldset style="max-width: 360px">
        <legend>Sound</legend>
        <label><input type="checkbox" id="soundToggle" checked /> Sound on</label>
        <label style="margin-left: 12px"
          >Effect:
          <select id="soundEffect">
            <option value="paperShuffle" selected>paper shuffle</option>
            <option value="cameraShutter">camera shutter</option>
            <option value="filmAdvance">film advance</option>
            <option value="polaroid">polaroid</option>
            <option value="flashPop">flash pop</option>
            <option value="none">none</option>
          </select>
        </label>
      </fieldset>
      <fieldset style="max-width: 360px">
        <legend>Advanced</legend>
        <label
          >Cuts/s: <input type="range" id="cutsInput" min="4" max="30" value="12" />
          <span id="cutsVal">12</span></label
        ><br />
        <label
          >Zoom: <input type="range" id="zoomInput" min="1" max="3" step="0.1" value="1.2" />
          <span id="zoomVal">1.2x</span></label
        ><br />
        <label
          >Blur: <input type="range" id="blurInput" min="0" max="3" step="0.1" value="0" />
          <span id="blurVal">0</span></label
        >
      </fieldset>
      <div
        id="progressWrap"
        style="width: 100%; height: 6px; background: #eee; max-width: 360px; margin-top: 8px"
      ></div>
      <canvas
        id="preview"
        width="540"
        height="960"
        style="border: 1px solid #ccc; max-width: 360px; width: 100%; background: #fff"
      ></canvas>
      <div id="examples" style="margin: 8px 0"></div>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
